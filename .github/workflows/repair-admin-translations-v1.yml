name: Repair admin translations v1

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/repair-admin-translations-v1.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/site-address-selection-ui-v1-20260712'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/site-address-selection-ui-v1-20260712
          fetch-depth: 0

      - name: Restore main translations and add address keys only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- messages/admin-main.ts
          base64 -d .tmp/admin-main-minimal.patch.b64 > /tmp/admin-main-minimal.patch
          git apply --check /tmp/admin-main-minimal.patch
          git apply /tmp/admin-main-minimal.patch

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit corrected translations
        shell: bash
        run: |
          set -euo pipefail
          git rm .tmp/admin-main-minimal.patch.b64 .github/workflows/repair-admin-translations-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add messages/admin-main.ts
          git commit -m 'Preserve existing admin translations'
          git push origin HEAD:fix/site-address-selection-ui-v1-20260712
