name: Apply address selection UI v1

on:
  push:
    branches:
      - fix/site-address-selection-ui-v1-20260712
    paths:
      - '.github/workflows/apply-address-ui-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/site-address-selection-ui-v1-20260712
          fetch-depth: 0

      - name: Rebuild patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/address-ui.b64.* | base64 -d > /tmp/address-ui.patch
          git apply --check /tmp/address-ui.patch
          git apply /tmp/address-ui.patch
          node scripts/build-admin-main.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit final files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .tmp/address-ui.b64.* .github/workflows/apply-address-ui-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/page.tsx app/api/admin/sites/route.ts 'app/api/admin/sites/[id]/route.ts' scripts/build-admin-main.mjs messages/admin-main.ts
          git commit -m 'Require selected address for site coordinates'
          git push origin HEAD:fix/site-address-selection-ui-v1-20260712
