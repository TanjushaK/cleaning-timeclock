name: Patch workforce map shortcut

on:
  push:
    branches:
      - feat/workforce-map-overview-v1-20260713

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workforce-map-overview-v1-20260713

      - name: Add workforce map shortcut to shifts
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/admin/page.tsx')
          text = path.read_text(encoding='utf-8')
          needle = '''                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      onClick={() => setJobsView('table')}'''
          replacement = '''                  <a
                    href="/admin/workforce-map"
                    className="rounded-2xl border border-yellow-300/45 bg-yellow-400/10 px-4 py-2 text-xs font-semibold text-yellow-100 transition hover:border-yellow-200/70 hover:bg-yellow-400/15"
                  >
                    Карта смен
                  </a>

                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      onClick={() => setJobsView('table')}'''
          if needle not in text:
              raise SystemExit('Target shifts toolbar block not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Remove temporary workflow
        run: rm .github/workflows/patch-workforce-map-shortcut.yml

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/admin/page.tsx .github/workflows/patch-workforce-map-shortcut.yml
          git commit -m "Add workforce map shortcut to shifts"
          git push
