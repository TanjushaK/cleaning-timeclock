name: One-time site map empty coordinates fix

on:
  push:
    branches:
      - fix/site-map-empty-coordinates-v1-20260713

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-map-empty-coordinates-v1-20260713
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Patch blank coordinate validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/admin/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = """function buildOpenStreetMapEmbedUrl(latRaw: string, lngRaw: string, radiusRaw: string): string | null {
  const lat = Number(latRaw)
  const lng = Number(lngRaw)
  const radius = Number(radiusRaw)
"""
          new = """function buildOpenStreetMapEmbedUrl(latRaw: string, lngRaw: string, radiusRaw: string): string | null {
  const latText = latRaw.trim()
  const lngText = lngRaw.trim()
  if (!latText || !lngText) return null

  const lat = Number(latText)
  const lng = Number(lngText)
  const radius = Number(radiusRaw)
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -n "const latText = latRaw.trim()" app/admin/page.tsx
          grep -n "if (!latText || !lngText) return null" app/admin/page.tsx
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit verified fix and remove one-time workflow
        run: |
          rm .github/workflows/one-time-site-map-empty-coordinates-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/admin/page.tsx .github/workflows/one-time-site-map-empty-coordinates-fix.yml
          git commit -m "Fix blank coordinates in site map preview"
          git push origin HEAD:fix/site-map-empty-coordinates-v1-20260713
