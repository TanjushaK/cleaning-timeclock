name: One-time guarded site map coordinate fix

on:
  push:
    branches:
      - fix/site-map-empty-coordinates-v1-20260713

permissions:
  contents: write

jobs:
  patch-test-and-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-map-empty-coordinates-v1-20260713
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply minimal coordinate validation fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/admin/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = """function buildOpenStreetMapEmbedUrl(latRaw: string, lngRaw: string, radiusRaw: string): string | null {
            const lat = Number(latRaw)
            const lng = Number(lngRaw)
            const radius = Number(radiusRaw)
          """
          new = """function buildOpenStreetMapEmbedUrl(latRaw: string, lngRaw: string, radiusRaw: string): string | null {
            const latValue = latRaw.trim()
            const lngValue = lngRaw.trim()
            if (!latValue || !lngValue) return null

            const lat = Number(latValue)
            const lng = Number(lngValue)
            const radius = Number(radiusRaw)
          """
          if old not in text:
              raise SystemExit('Expected coordinate helper block not found; refusing broad edit')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one coordinate helper block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify diff scope
        shell: bash
        run: |
          git diff -- app/admin/page.tsx
          changed="$(git diff --name-only | sort)"
          test "$changed" = "app/admin/page.tsx"
          grep -F "const latValue = latRaw.trim()" app/admin/page.tsx
          grep -F "const lngValue = lngRaw.trim()" app/admin/page.tsx
          grep -F "if (!latValue || !lngValue) return null" app/admin/page.tsx

      - name: Remove one-time workflow and commit verified fix
        shell: bash
        run: |
          rm .github/workflows/one-time-fix-site-map-empty-coordinates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx .github/workflows/one-time-fix-site-map-empty-coordinates.yml
          git commit -m "Reject blank site map coordinates"
          git push origin HEAD:fix/site-map-empty-coordinates-v1-20260713
