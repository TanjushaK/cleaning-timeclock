name: One-time reports dates order patch

on:
  push:
    branches:
      - fix/reports-dates-today-backwards-20260903

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/reports-dates-today-backwards-20260903
          fetch-depth: 0

      - name: Guard branch base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "f842af3c11c3d5e5068d355441e84da1016d9909"

      - name: Patch only report date ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/admin/hours/page.tsx')
          text = path.read_text(encoding='utf-8-sig')

          marker = "function isISODate(s: string) {\n  return /^\\d{4}-\\d{2}-\\d{2}$/.test(s)\n}\n\n"
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected isISODate marker count: {text.count(marker)}')

          helper = '''function compareReportDatesTodayBackwards(aDate: string, bDate: string) {\n  const today = toISODate(new Date())\n  const a = isISODate(aDate) ? aDate : ''\n  const b = isISODate(bDate) ? bDate : ''\n\n  if (!a || !b) {\n    if (!a && !b) return 0\n    return a ? -1 : 1\n  }\n\n  const aFuture = a > today\n  const bFuture = b > today\n\n  if (aFuture !== bFuture) return aFuture ? 1 : -1\n  if (a === b) return 0\n  if (aFuture) return a.localeCompare(b)\n  return b.localeCompare(a)\n}\n\nfunction compareReportJobsTodayBackwards(a: ReportJobDetail, b: ReportJobDetail) {\n  const dateOrder = compareReportDatesTodayBackwards(a.job_date, b.job_date)\n  if (dateOrder !== 0) return dateOrder\n\n  const timeOrder = String(a.scheduled_time || '').localeCompare(String(b.scheduled_time || ''))\n  if (timeOrder !== 0) return timeOrder\n\n  return String(a.job_id).localeCompare(String(b.job_id))\n}\n\n'''

          text = text.replace(marker, marker + helper, 1)

          old_day = "data.by_day.map((d) => ("
          new_day = "[...data.by_day].sort((a, b) => compareReportDatesTodayBackwards(a.date, b.date)).map((d) => ("
          if text.count(old_day) != 1:
              raise SystemExit(f'unexpected by_day map count: {text.count(old_day)}')
          text = text.replace(old_day, new_day, 1)

          old_jobs = "{data.job_details.map((j) => ("
          new_jobs = "{[...data.job_details].sort(compareReportJobsTodayBackwards).map((j) => ("
          if text.count(old_jobs) != 1:
              raise SystemExit(f'unexpected job_details map count: {text.count(old_jobs)}')
          text = text.replace(old_jobs, new_jobs, 1)

          if text.count('compareReportDatesTodayBackwards') < 3:
              raise SystemExit('date comparator was not wired into the report view')
          if text.count('compareReportJobsTodayBackwards') != 2:
              raise SystemExit('job comparator was not wired exactly once')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch scope and semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "app/admin/hours/page.tsx"
          grep -Fq 'function compareReportDatesTodayBackwards(aDate: string, bDate: string)' app/admin/hours/page.tsx
          grep -Fq 'function compareReportJobsTodayBackwards(a: ReportJobDetail, b: ReportJobDetail)' app/admin/hours/page.tsx
          grep -Fq '[...data.by_day].sort((a, b) => compareReportDatesTodayBackwards(a.date, b.date)).map((d) => (' app/admin/hours/page.tsx
          grep -Fq '{[...data.job_details].sort(compareReportJobsTodayBackwards).map((j) => (' app/admin/hours/page.tsx
          grep -Fq 'if (aFuture !== bFuture) return aFuture ? 1 : -1' app/admin/hours/page.tsx
          grep -Fq 'return b.localeCompare(a)' app/admin/hours/page.tsx
          grep -Fq 'if (aFuture) return a.localeCompare(b)' app/admin/hours/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Workforce map tests
        run: npm run test:workforce-map

      - name: Checkout geofence tests
        run: npm run test:checkout-geofence

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-reports-dates-order.yml
          git add app/admin/hours/page.tsx
          git diff --cached --check
          git commit -m 'Show report dates from today backwards'
          git push origin HEAD:fix/reports-dates-today-backwards-20260903
