name: One-time worker readable hours patch

on:
  push:
    branches:
      - fix/worker-readable-hours-v1-20260903

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_PUBLIC_ORIGIN: "http://localhost:3000"
      DATABASE_URL: "postgres://ci:ci@127.0.0.1:5432/ci"
      JWT_SECRET: "ci_jwt_secret_at_least_32_characters_min"
      STORAGE_SIGNING_SECRET: "ci_storage_signing_at_least_32_characters"
      UPLOAD_ROOT: "./var/uploads"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/worker-readable-hours-v1-20260903
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Apply exact one-file display patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text(encoding="utf-8")

          old = '''function formatDurationHoursLabel(lang: string, durationMin: number, tr: (key: any) => string): string {
            const hours = durationMin / 60;
            const asText = Number(hours.toFixed(2)).toString();
            if (lang === "ru" || lang === "uk") {
              return `${asText.replace(".", ",")}${tr("jobs.hoursShort")}`;
            }
            return `${asText}${tr("jobs.hoursShort")}`;
          }
          '''

          new = '''function formatDurationHoursLabel(lang: string, durationMin: number): string {
            const totalMinutes = Math.max(0, Math.floor(durationMin || 0));
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            const minutesText = String(minutes).padStart(2, "0");
            const locale = String(lang || "en").toLowerCase();

            if (locale === "ru") return `${hours} ч ${minutesText} мин`;
            if (locale === "uk") return `${hours} год ${minutesText} хв`;
            if (locale === "nl") return `${hours} u ${minutesText} min`;
            return `${hours} h ${minutesText} min`;
          }
          '''

          if text.count(old) != 1:
              raise SystemExit(f"expected formatter exactly once, found {text.count(old)}")

          replacements = {
              "formatDurationHoursLabel(lang, plannedDayMinutes, tr)": "formatDurationHoursLabel(lang, plannedDayMinutes)",
              "formatDurationHoursLabel(lang, workedDayMinutes, tr)": "formatDurationHoursLabel(lang, workedDayMinutes)",
              "formatDurationHoursLabel(lang, plannedPeriodMinutes, tr)": "formatDurationHoursLabel(lang, plannedPeriodMinutes)",
              "formatDurationHoursLabel(lang, workedPeriodMinutes, tr)": "formatDurationHoursLabel(lang, workedPeriodMinutes)",
              "formatDurationHoursLabel(lang, durationMin, tr)": "formatDurationHoursLabel(lang, durationMin)",
              "formatDurationHoursLabel(lang, workedMin, tr)": "formatDurationHoursLabel(lang, workedMin)",
          }

          text = text.replace(old, new, 1)
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f"expected call exactly once: {before}; found {text.count(before)}")
              text = text.replace(before, after, 1)

          forbidden = [
              "const hours = durationMin / 60;",
              "hours.toFixed(2)",
              "formatDurationHoursLabel(lang, plannedDayMinutes, tr)",
              "formatDurationHoursLabel(lang, workedDayMinutes, tr)",
              "formatDurationHoursLabel(lang, plannedPeriodMinutes, tr)",
              "formatDurationHoursLabel(lang, workedPeriodMinutes, tr)",
              "formatDurationHoursLabel(lang, durationMin, tr)",
              "formatDurationHoursLabel(lang, workedMin, tr)",
          ]
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f"forbidden old display logic remains: {needle}")

          if text.count("function formatDurationHoursLabel") != 1:
              raise SystemExit("formatter definition count changed unexpectedly")
          if text.count("formatDurationHoursLabel(lang,") != 6:
              raise SystemExit("worker duration formatter call count is not 6")

          path.write_text(text, encoding="utf-8", newline="")
          PY

          git diff --check
          test "$(git diff --name-only)" = "app/page.tsx"

      - name: Install dependencies
        run: npm ci

      - name: Workforce map tests
        run: npm run test:workforce-map

      - name: Checkout geofence tests
        run: npm run test:checkout-geofence

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit exact file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          test "$(git diff --cached --name-only)" = "app/page.tsx"
          git commit -m "Show worker durations as hours and minutes"
          git push origin HEAD:fix/worker-readable-hours-v1-20260903
